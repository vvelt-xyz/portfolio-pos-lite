<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>WELT POS — マニュアル</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #10151c;
        color: #e9eef5;
        line-height: 1.55;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      .muted {
        color: #8b9aab;
      }
      a {
        color: #3d9a7a;
      }
      ol {
        padding-left: 1.25rem;
      }
      li {
        margin: 0.55rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WELT POS — 操作マニュアル</h1>
      <p class="muted">
        株式会社WELT のポートフォリオ用デモです。個人情報は送信しません。設定タブは閲覧のみです。
      </p>
      <ol>
        <li>フロアで空席を選び、人数を入れて「案内する」（またはテイクアウト）。</li>
        <li>メニューを追加し、必要なら数量変更・取消のあと「キッチンへ送る」。</li>
        <li>「提供」タブで提供済みにする。</li>
        <li>接客中の席（または TO）から「会計」→ 支払手段 → 確定。</li>
        <li>「設定」で税率・メニュー・席配置の構造を見る（変更不可）。</li>
      </ol>
      <p><a href="/">← デモに戻る</a></p>
      <p class="muted">© 株式会社WELT</p>
    </main>
  </body>
