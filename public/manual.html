<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>POS Lite — 操作マニュアル</title>
    <style>
      :root {
        --bg: #0f1419;
        --ink: #e8eef4;
        --muted: #8b9aab;
        --accent: #3d9a7a;
        --line: #2c3848;
        --font: system-ui, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        line-height: 1.55;
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      .note {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 1.5rem;
      }
      ol {
        padding-left: 1.25rem;
      }
      li {
        margin: 0.65rem 0;
      }
      a {
        color: var(--accent);
      }
      hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 1.75rem 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>POS Lite — 操作マニュアル</h1>
      <p class="note">
        ポートフォリオ用デモです。データはブラウザの localStorage のみに保存され、サーバーへ個人情報は送りません。
      </p>
      <ol>
        <li><strong>フロア</strong>で空席をタップして選択し、「案内」を押す（複数席可）。</li>
        <li>メニューの「追加」で明細を入れ、「キッチンへ送る」。</li>
        <li><strong>提供</strong>タブで「提供済み」にする。</li>
        <li>フロアから接客中席を開き、「会計」→「会計する」。</li>
        <li>やり直すときは「デモを初期化」。</li>
      </ol>
      <hr />
      <p><a href="/">← デモに戻る</a></p>
    </main>
  </body>
</html>
